<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- A11y and Mobile Viewport Settings -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#58CC02" />
  <meta name="robots" content="noindex" />
  
  <!-- iOS Safari Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kailyn's PA Prep" />
  <link rel="apple-touch-icon" sizes="180x180" href="PA-App-Icon.png?v=3" />

  <!-- Android Chrome PWA Support -->
  <link rel="icon" type="image/png" sizes="512x512" href="PA-App-Icon.png?v=3" />
  
  <title>Kailyn's UArizona PA '27 Prep</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- EXTERNAL QUESTION BANK: Loads questions.js automatically -->
  <script src="questions.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Nunito', 'sans-serif'] },
          colors: {
            duogreen: { DEFAULT: '#58CC02', dark: '#46A302', bg: '#D7FFB8' },
            duoblue: { DEFAULT: '#1CB0F6', dark: '#1899D6', bg: '#EBF7FF' },
            duoheart: { DEFAULT: '#FF4B4B', dark: '#EA2B2B', bg: '#FFDFE0' },
            duogem: '#1CB0F6',
            duofire: '#FF9600'
          }
        }
      }
    }
  </script>
  <style>
    /* CSS Classes to replace inline Tailwind clutter */
    .btn-3d { @apply border-b-4 active:translate-y-1 active:border-b-0 transition-all; }
    .btn-card-3d { @apply border-2 border-b-4 border-slate-200 bg-white hover:bg-slate-50 active:translate-y-1 active:border-b-2; }
    .btn-card-selected { @apply border-2 border-b-4 border-duoblue bg-duoblue-bg text-duoblue active:translate-y-1 active:border-b-2; }
    .btn-card-correct { @apply border-2 border-b-4 border-duogreen bg-duogreen-bg text-duogreen-dark; }
    .btn-card-incorrect { @apply border-2 border-b-4 border-duoheart bg-duoheart-bg text-duoheart-dark opacity-50; }
    
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }
    .animate-wiggle { animation: wiggle 0.4s ease-in-out; }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .animate-shake { animation: shake 0.3s ease-in-out; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 font-sans min-h-dvh flex flex-col selection:bg-duogreen selection:text-white relative">

  <!-- TOP STATS BAR -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-sm border-b-2 border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-4 w-full max-w-2xl mx-auto">
      <div class="flex items-center space-x-1.5 text-duofire font-black text-sm">
        <i class="fa-solid fa-fire"></i> <span id="statStreak">0</span>
      </div>
      <div class="flex items-center space-x-1.5 text-duogem font-black text-sm">
        <i class="fa-solid fa-gem"></i> <span id="statXP">0</span>
      </div>
      <div class="flex items-center space-x-1.5 text-duoheart font-black text-sm ml-auto" onclick="refillHearts()">
        <i class="fa-solid fa-heart"></i> <span id="statHearts">5</span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 w-full max-w-2xl mx-auto p-4 pb-24">

    <!-- TAB 1: DYNAMIC ROADMAP (Winding Path) -->
    <section id="tab-roadmap" class="flex flex-col items-center pt-6">
      <div class="bg-white border-2 border-slate-200 rounded-3xl p-4 mb-8 w-full shadow-sm flex items-center space-x-4">
        <div class="w-16 h-16 rounded-2xl bg-duogreen-bg text-4xl flex items-center justify-center">🦉</div>
        <div>
          <h2 class="text-sm font-black text-slate-800">Hi Kayfart! 💖</h2>
          <p id="mascotText" class="text-xs font-bold text-slate-500 mt-1">Ready to crush PA school? Pick a lesson below!</p>
        </div>
      </div>
      
      <!-- DYNAMIC NODES INJECTED HERE -->
      <div id="dynamicRoadmap" class="w-full flex flex-col items-center py-4"></div>
    </section>

    <!-- TAB 2: ACTIVE QUIZ SESSION -->
    <section id="tab-quiz" class="hidden flex flex-col min-h-[75vh] justify-between">
      <div>
        <div class="flex items-center justify-between space-x-3 mb-3">
          <button aria-label="Exit Quiz" onclick="switchTab('roadmap')" class="text-slate-400 hover:text-slate-600 p-1 font-black text-lg">
            <i class="fa-solid fa-xmark"></i>
          </button>
          <div class="flex-1 bg-slate-200 h-4 rounded-full overflow-hidden">
            <div id="quizProgressBar" class="h-full bg-duogreen transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <!-- Question Card -->
        <div class="mt-2 bg-white rounded-3xl p-4 border-2 border-slate-200 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <span id="qCategoryPill" class="text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full bg-duoblue-bg text-duoblue-dark border border-duoblue">CATEGORY</span>
            <button id="qVoiceBtn" aria-label="Play Audio" onclick="speakCurrentPrompt()" class="hidden w-8 h-8 rounded-full bg-duoblue-bg border border-duoblue text-duoblue flex items-center justify-center text-sm active:scale-95 transition">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </div>
          <div id="qImageContainer" class="hidden w-full mb-3 rounded-xl overflow-hidden border-2 border-slate-100 bg-slate-50 flex justify-center">
            <img id="qImage" src="" alt="Clinical Diagram" class="max-h-48 object-contain" onerror="this.parentElement.classList.add('hidden')" />
          </div>
          <h3 id="quizQuestionText" class="text-base font-extrabold text-slate-800 leading-snug">Question text goes here?</h3>
        </div>

        <div id="quizChoicesContainer" class="mt-4 space-y-2.5"></div>
      </div>

      <!-- Action Footer -->
      <div id="quizActionFooter" class="mt-6 pt-3">
        <button id="btnCheckAnswer" aria-label="Check Answer" onclick="handleCheckOrNext()" class="w-full py-3.5 rounded-2xl text-white font-black text-sm uppercase tracking-wider shadow-md transition btn-3d bg-slate-300 border-slate-400 cursor-not-allowed">
          Check Answer
        </button>
      </div>

      <!-- Result Drawer -->
      <div id="resultDrawer" class="hidden mt-4 p-4 rounded-3xl border-2 transition-all">
        <div class="flex items-start space-x-3">
          <div id="resultIcon" class="w-10 h-10 rounded-full flex items-center justify-center font-black text-xl shrink-0"></div>
          <div>
            <h4 id="resultTitle" class="text-base font-black"></h4>
            <p id="resultExplanation" class="text-xs font-bold mt-1 leading-relaxed"></p>
          </div>
        </div>
        <button id="btnDrawerContinue" aria-label="Continue" onclick="handleCheckOrNext()" class="mt-3 w-full py-3 rounded-2xl text-white font-black text-sm uppercase tracking-wider transition btn-3d">
          Continue
        </button>
      </div>
    </section>

    <!-- TAB 3: SPANISH CLINIC LAB -->
    <section id="tab-spanish" class="hidden pb-8">
      <div class="flex space-x-2 overflow-x-auto pb-2 scrollbar-hide mb-4">
        <button onclick="filterSpanish('all')" class="span-filter px-3 py-1.5 rounded-xl text-xs font-black bg-duoblue text-white">All</button>
        <button onclick="filterSpanish('hpi')" class="span-filter px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-200 text-slate-700">HPI</button>
        <button onclick="filterSpanish('exam')" class="span-filter px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-200 text-slate-700">Exam</button>
        <button onclick="filterSpanish('meds')" class="span-filter px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-200 text-slate-700">Meds</button>
      </div>
      <div id="spanishCardsList" class="space-y-3"></div>
    </section>

    <!-- TAB 4: MISTAKES TENT -->
    <section id="tab-mistakes" class="hidden pb-8">
      <div id="mistakesContainer" class="space-y-3"></div>
    </section>
  </main>

  <!-- BOTTOM NAVIGATION APP BAR -->
  <nav id="bottomNav" class="fixed bottom-0 w-full bg-white border-t-2 border-slate-200 pb-safe pt-1 px-6 z-50">
    <div class="flex justify-between max-w-md mx-auto">
      <button aria-label="Roadmap" onclick="switchTab('roadmap')" id="nav-roadmap" class="flex flex-col items-center p-2 text-duogreen font-black transition">
        <i class="fa-solid fa-map-location-dot text-xl mb-1"></i>
      </button>
      <button aria-label="Spanish Lab" onclick="switchTab('spanish')" id="nav-spanish" class="flex flex-col items-center p-2 text-slate-400 font-bold hover:text-slate-600 transition">
        <i class="fa-solid fa-language text-xl mb-1"></i>
      </button>
      <button aria-label="Mistakes" onclick="switchTab('mistakes')" id="nav-mistakes" class="flex flex-col items-center p-2 text-slate-400 font-bold hover:text-slate-600 transition relative">
        <i class="fa-solid fa-shield-halved text-xl mb-1"></i>
      </button>
    </div>
  </nav>

  <!-- CELEBRATION MODAL FOR KAILYN -->
  <div id="celebrationModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4" role="dialog" aria-modal="true">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center border-4 border-duogreen shadow-xl relative animate-wiggle">
      <div class="text-6xl mb-2">🥹💖</div>
      <h2 class="text-xl font-black text-slate-800 mb-2">I'm so proud of you my love!</h2>
      <p id="modalMsg" class="text-sm font-bold text-slate-500 mb-6">You are doing amazing, Kayfart. Keep going!</p>
      <button aria-label="Close Modal" onclick="closeModal()" class="w-full py-3 rounded-2xl bg-duogreen text-white font-black text-sm uppercase btn-3d border-duogreen-dark">
        I love you too!
      </button>
    </div>
  </div>

  <script>
    // --- LOCAL STORAGE STATE ---
    const STORAGE_KEY = 'kailyn_pa_v3';
    let gameState = { streak: 0, lastDate: null, xp: 0, hearts: 5, mistakesIds: [] };

    function initApp() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) gameState = { ...gameState, ...JSON.parse(raw) };
      } catch (e) {}

      // Daily Streak Logic
      const today = new Date().toDateString();
      if (gameState.lastDate !== today) {
        if (gameState.lastDate === new Date(Date.now() - 86400000).toDateString()) {
          gameState.streak++;
        } else if (gameState.lastDate !== null) {
          gameState.streak = 1; // Reset streak if missed a day
        } else {
          gameState.streak = 1; // First day
        }
        gameState.lastDate = today;
        saveState();
      }
      
      updateUI();
      renderDynamicRoadmap();
      switchTab('roadmap');
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
      updateUI();
    }

    function updateUI() {
      document.getElementById('statStreak').textContent = gameState.streak;
      document.getElementById('statXP').textContent = gameState.xp;
      document.getElementById('statHearts').textContent = gameState.hearts;
    }

    function refillHearts() {
      if (gameState.hearts < 5) {
        gameState.hearts = 5;
        saveState();
        showModal("Hearts Refilled! 💖", "I topped off your hearts, Kayfart. You've got this!");
      }
    }

    // --- DYNAMIC ROADMAP GENERATOR ---
    function renderDynamicRoadmap() {
      const container = document.getElementById('dynamicRoadmap');
      if (!window.EXPANDED_QUESTION_BANK) {
        container.innerHTML = `<p class="text-duoheart font-bold">Error: questions.js not loaded. Check file path.</p>`;
        return;
      }

      // 1. Group questions by their unique 'topic' tag
      const topics = [...new Set(window.EXPANDED_QUESTION_BANK.map(q => q.topic))];
      
      let html = '';
      topics.forEach((topic, index) => {
        const topicQs = window.EXPANDED_QUESTION_BANK.filter(q => q.topic === topic);
        const count = topicQs.length;
        const categoryName = topicQs[0].category || topic;
        
        // 2. Calculate Winding Path Offset (Snake-like curve)
        const offsets = [0, -35, -55, -35, 0, 35, 55, 35];
        const shift = offsets[index % offsets.length];

        html += `
          <div class="flex flex-col items-center mb-12" style="transform: translateX(${shift}px)">
            <button aria-label="Start ${categoryName}" onclick="startSpecificUnit('${topic}')" class="w-16 h-16 rounded-full bg-duogreen text-white font-black text-2xl border-b-4 border-duogreen-dark shadow-sm active:translate-y-1 active:border-b-0 transition flex items-center justify-center relative hover:brightness-110">
              <i class="fa-solid fa-star"></i>
              <div class="absolute -bottom-7 flex flex-col items-center z-10">
                <span class="text-[11px] text-slate-700 font-extrabold whitespace-nowrap bg-white px-2.5 py-1 rounded-lg shadow-sm border-2 border-slate-200">
                  ${categoryName} (${count})
                </span>
              </div>
            </button>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // --- QUIZ LOGIC (Fisher-Yates Shuffle & Session Isolation) ---
    let activeDeck = [];
    let currentQIndex = 0;
    let selectedOptionIndex = null;
    let hasAnswered = false;
    let combo = 0;

    // True Fisher-Yates Shuffle Function
    function shuffleArray(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startSpecificUnit(topicTag) {
      if (gameState.hearts <= 0) {
        showModal("Out of Hearts! 💔", "Take a breather, Kayfart. Tap your hearts at the top to refill!");
        return;
      }
      // Pull questions for the selected topic
      const pool = window.EXPANDED_QUESTION_BANK.filter(q => q.topic === topicTag);
      
      // Shuffle the deck and slice a max of 8 for a quick session
      activeDeck = shuffleArray(pool).slice(0, 8);
      
      // Deep clone and shuffle the options for EACH question so 'A' isn't always correct
      activeDeck = activeDeck.map(q => {
        let paired = q.options.map((text, idx) => ({ text, isCorrect: idx === q.correct }));
        let shuffledPairs = shuffleArray(paired);
        return {
          ...q,
          sessionOptions: shuffledPairs.map(p => p.text),
          sessionCorrectIndex: shuffledPairs.findIndex(p => p.isCorrect)
        };
      });

      currentQIndex = 0;
      combo = 0;
      switchTab('quiz');
      loadQuestion();
    }

    function loadQuestion() {
      hasAnswered = false;
      selectedOptionIndex = null;
      document.getElementById('resultDrawer').classList.add('hidden');
      document.getElementById('quizActionFooter').classList.remove('hidden');

      const q = activeDeck[currentQIndex];
      if (!q) return finishSession();

      const pct = Math.round((currentQIndex / activeDeck.length) * 100);
      document.getElementById('quizProgressBar').style.width = `${Math.max(5, pct)}%`;
      document.getElementById('qCategoryPill').textContent = q.category.toUpperCase();
      document.getElementById('quizQuestionText').textContent = q.prompt;

      const voiceBtn = document.getElementById('qVoiceBtn');
      if (q.audioText) {
        voiceBtn.classList.remove('hidden');
        voiceBtn.dataset.text = q.audioText;
      } else {
        voiceBtn.classList.add('hidden');
      }

      // Handle Image
      const imgCont = document.getElementById('qImageContainer');
      const imgEl = document.getElementById('qImage');
      if (q.imageUrl) {
        imgEl.src = q.imageUrl;
        imgCont.classList.remove('hidden');
      } else {
        imgCont.classList.add('hidden');
      }

      // Render Shuffled Choices
      const letters = ['A', 'B', 'C', 'D'];
      const container = document.getElementById('quizChoicesContainer');
      container.innerHTML = q.sessionOptions.map((text, idx) => `
        <button id="choice_${idx}" onclick="selectChoice(${idx})" class="w-full text-left p-3.5 rounded-2xl btn-card-3d flex items-center space-x-3">
          <span class="w-7 h-7 rounded-xl bg-slate-100 border border-slate-300 text-slate-700 font-black text-xs flex items-center justify-center shrink-0">${letters[idx]}</span>
          <span class="text-xs font-bold text-slate-800 leading-snug flex-1">${text}</span>
        </button>
      `).join('');

      const btnCheck = document.getElementById('btnCheckAnswer');
      btnCheck.textContent = 'Check Answer';
      btnCheck.className = 'w-full py-3.5 rounded-2xl text-white font-black text-sm uppercase tracking-wider shadow-md transition btn-3d bg-slate-300 border-slate-400 cursor-not-allowed';
    }

    function selectChoice(idx) {
      if (hasAnswered) return;
      selectedOptionIndex = idx;
      
      document.querySelectorAll('#quizChoicesContainer button').forEach((b, i) => {
        b.className = i === idx 
          ? 'w-full text-left p-3.5 rounded-2xl flex items-center space-x-3 btn-card-selected'
          : 'w-full text-left p-3.5 rounded-2xl flex items-center space-x-3 btn-card-3d';
      });

      const btnCheck = document.getElementById('btnCheckAnswer');
      btnCheck.className = 'w-full py-3.5 rounded-2xl text-white font-black text-sm uppercase tracking-wider shadow-md transition btn-3d bg-duogreen border-duogreen-dark';
    }

    function handleCheckOrNext() {
      if (selectedOptionIndex === null) return;
      if (hasAnswered) {
        if (currentQIndex < activeDeck.length - 1) {
          currentQIndex++;
          loadQuestion();
        } else {
          finishSession();
        }
        return;
      }

      hasAnswered = true;
      const q = activeDeck[currentQIndex];
      const isCorrect = (selectedOptionIndex === q.sessionCorrectIndex);

      document.getElementById('quizActionFooter').classList.add('hidden');
      const drawer = document.getElementById('resultDrawer');
      const icon = document.getElementById('resultIcon');
      const title = document.getElementById('resultTitle');
      const exp = document.getElementById('resultExplanation');
      const btn = document.getElementById('btnDrawerContinue');

      drawer.classList.remove('hidden');

      if (isCorrect) {
        combo++;
        gameState.xp += 15;
        document.getElementById(`choice_${selectedOptionIndex}`).className = 'w-full text-left p-3.5 rounded-2xl flex items-center space-x-3 btn-card-correct';
        
        drawer.className = 'mt-4 p-4 rounded-3xl border-2 border-duogreen bg-duogreen-bg transition-all';
        icon.className = 'w-10 h-10 rounded-full bg-duogreen text-white flex items-center justify-center font-black text-xl shrink-0';
        icon.innerHTML = '✓';
        title.className = 'text-base font-black text-[#357B01]';
        title.textContent = combo > 1 ? `Brilliant! 🔥 Combo x${combo}` : 'Nicely done!';
        exp.className = 'text-xs font-bold mt-1 text-[#357B01]';
        exp.innerHTML = `<span class="font-black">Pearl:</span> ${q.pearl}`;
        btn.className = 'mt-3 w-full py-3 rounded-2xl text-white font-black text-sm uppercase transition btn-3d bg-duogreen border-duogreen-dark';
        
        // Remove from mistakes
        gameState.mistakesIds = gameState.mistakesIds.filter(id => id !== q.id);
      } else {
        combo = 0;
        gameState.hearts = Math.max(0, gameState.hearts - 1);
        if (!gameState.mistakesIds.includes(q.id)) gameState.mistakesIds.push(q.id);

        document.getElementById(`choice_${selectedOptionIndex}`).className = 'w-full text-left p-3.5 rounded-2xl flex items-center space-x-3 btn-card-incorrect';
        document.getElementById(`choice_${q.sessionCorrectIndex}`).className = 'w-full text-left p-3.5 rounded-2xl flex items-center space-x-3 btn-card-correct';

        drawer.className = 'mt-4 p-4 rounded-3xl border-2 border-duoheart bg-duoheart-bg transition-all animate-shake';
        icon.className = 'w-10 h-10 rounded-full bg-duoheart text-white flex items-center justify-center font-black text-xl shrink-0';
        icon.innerHTML = '✕';
        title.className = 'text-base font-black text-duoheart-dark';
        title.textContent = "Shake it off my love! Here's the pearl:";
        exp.className = 'text-xs font-bold mt-1 text-[#931717]';
        exp.innerHTML = `<span class="font-black">${q.sessionOptions[q.sessionCorrectIndex]}</span><br><br><span class="font-black">Why:</span> ${q.pearl}`;
        btn.className = 'mt-3 w-full py-3 rounded-2xl text-white font-black text-sm uppercase transition btn-3d bg-duoheart border-duoheart-dark';
      }
      saveState();
    }

    function finishSession() {
      gameState.xp += 30;
      saveState();
      switchTab('roadmap');
      if (Math.random() > 0.4) {
        showModal("Lesson Complete! 🎉", "Good job Kayfart! I'm so proud of how hard you are studying. +30 XP! 🥹");
      }
    }

    // --- TAB SWITCHING & UI ---
    function switchTab(tabId) {
      ['roadmap', 'quiz', 'spanish', 'mistakes'].forEach(k => {
        document.getElementById(`tab-${k}`).classList.toggle('hidden', k !== tabId);
        const nav = document.getElementById(`nav-${k}`);
        if(nav) nav.className = k === tabId 
          ? 'flex flex-col items-center p-2 text-duogreen font-black transition'
          : 'flex flex-col items-center p-2 text-slate-400 font-bold hover:text-slate-600 transition';
      });

      if (tabId === 'spanish') renderSpanish();
      if (tabId === 'mistakes') renderMistakes();
      window.scrollTo(0, 0);
    }

    // --- SPANISH LAB ---
    function renderSpanish(filter = 'all') {
      if(!window.SPANISH_CLINIC_PHRASES) return;
      const list = document.getElementById('spanishCardsList');
      const data = filter === 'all' ? window.SPANISH_CLINIC_PHRASES : window.SPANISH_CLINIC_PHRASES.filter(p => p.tag === filter);
      
      list.innerHTML = data.map((item, i) => `
        <div class="bg-white rounded-2xl p-3.5 border-2 border-slate-200 flex items-center justify-between shadow-sm hover:border-duoblue transition">
          <div class="flex-1 pr-2">
            <h4 class="text-xs font-black text-slate-800">${item.es}</h4>
            <p class="text-[11px] font-bold text-slate-500 mt-0.5">${item.en}</p>
          </div>
          <button aria-label="Listen" onclick="speakText(this.dataset.text)" data-text="${item.es.replace(/"/g, '&quot;')}" class="w-10 h-10 rounded-2xl bg-duoblue-bg border-2 border-b-4 border-[#84D8FF] text-duoblue flex items-center justify-center text-sm active:translate-y-1 active:border-b-2 transition shrink-0">
            <i class="fa-solid fa-volume-high"></i>
          </button>
        </div>
      `).join('');
    }

    function filterSpanish(tag) {
      document.querySelectorAll('.span-filter').forEach(btn => {
        btn.className = 'span-filter px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-200 text-slate-700';
      });
      event.target.className = 'span-filter px-3 py-1.5 rounded-xl text-xs font-black bg-duoblue text-white';
      renderSpanish(tag);
    }

    // --- MISTAKES TENT ---
    function renderMistakes() {
      const container = document.getElementById('mistakesContainer');
      if(!window.EXPANDED_QUESTION_BANK) return;
      const missed = window.EXPANDED_QUESTION_BANK.filter(q => gameState.mistakesIds.includes(q.id));

      if (missed.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-3xl p-6 border-2 border-slate-200 text-center">
            <div class="text-4xl mb-2">🛡️</div>
            <h3 class="text-sm font-black text-slate-800">Zero Mistakes, Kayfart! 💖</h3>
            <p class="text-xs font-bold text-slate-500 mt-1">You have cleared every single missed question. I’m so proud of you my love! 🥹</p>
          </div>`;
        return;
      }

      container.innerHTML = `
        <button onclick="startMistakesSession()" class="w-full py-3 rounded-2xl text-white font-black text-xs uppercase tracking-wider btn-3d bg-duoheart border-duoheart-dark shadow-sm mb-3">
          Practice ${missed.length} Missed Question${missed.length > 1 ? 's' : ''} Now
        </button>
      ` + missed.map(q => `
        <div class="bg-white rounded-2xl p-3.5 border-2 border-slate-200 space-y-1">
          <span class="text-[9px] font-black uppercase text-duoheart-dark bg-duoheart-bg px-2 py-0.5 rounded-md">${q.category}</span>
          <h4 class="text-xs font-black text-slate-800 mt-1">${q.prompt}</h4>
          <p class="text-[11px] font-bold text-duogreen-dark bg-duogreen-bg p-2 rounded-xl mt-1">
            <span class="font-black">Correct:</span> ${q.options[q.correct]}
          </p>
        </div>
      `).join('');
    }

    function startMistakesSession() {
      if (gameState.hearts <= 0) {
        showModal("Out of Hearts! 💔", "Take a breather, Kayfart. Tap your hearts at the top to refill!");
        return;
      }
      const pool = window.EXPANDED_QUESTION_BANK.filter(q => gameState.mistakesIds.includes(q.id));
      activeDeck = shuffleArray(pool).slice(0, 8).map(q => {
        let paired = q.options.map((text, idx) => ({ text, isCorrect: idx === q.correct }));
        let shuffledPairs = shuffleArray(paired);
        return {
          ...q,
          sessionOptions: shuffledPairs.map(p => p.text),
          sessionCorrectIndex: shuffledPairs.findIndex(p => p.isCorrect)
        };
      });
      currentQIndex = 0;
      combo = 0;
      switchTab('quiz');
      loadQuestion();
    }

    // --- AUDIO HELPER ---
    function speakCurrentPrompt() {
      const btn = document.getElementById('qVoiceBtn');
      if(btn.dataset.text) speakText(btn.dataset.text);
    }
    
    function speakText(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'es-MX';
      msg.rate = 0.9;
      window.speechSynthesis.speak(msg);
    }

    // --- MODAL SYSTEM ---
    function showModal(title, msg) {
      document.getElementById('celebrationModal').classList.remove('hidden');
      document.querySelector('#celebrationModal h2').textContent = title;
      document.getElementById('modalMsg').textContent = msg;
    }
    function closeModal() {
      document.getElementById('celebrationModal').classList.add('hidden');
    }

    // Initialize on load
    window.onload = initApp;
  </script>
</body>
</html>
